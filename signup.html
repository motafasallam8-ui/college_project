<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bistro Royale — Sign Up</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 90px 1.5rem 2rem;
      background: var(--bg2);
      position: relative;
      overflow: hidden
    }

    .auth-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 70% 50%, var(--bg3) 0%, transparent 60%)
    }

    .auth-card {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 3rem;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 2;
      animation: fadeInUp .6s both
    }

    .auth-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: .3rem
    }

    .auth-sub {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 2rem
    }

    .pw-wrap {
      position: relative
    }

    .pw-wrap input {
      padding-right: 48px
    }

    .pw-eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem
    }

    .pw-eye:hover {
      color: var(--accent)
    }

    .strength-bar {
      height: 4px;
      border-radius: 99px;
      background: var(--border2);
      margin-top: 6px
    }

    .strength-fill {
      height: 100%;
      border-radius: 99px;
      transition: all .35s;
      width: 0
    }

    .strength-text {
      font-size: .7rem;
      margin-top: 3px;
      font-weight: 600
    }

    .food-prefs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .6rem;
      margin-top: .6rem
    }

    .pref-chip {
      padding: 9px 8px;
      border: 1.5px solid var(--border2);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
      transition: all .2s;
      user-select: none;
      color: var(--text2)
    }

    .pref-chip:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .pref-chip.selected {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent)
    }

    .terms-row {
      display: flex;
      align-items: flex-start;
      gap: .7rem;
      margin-bottom: 1.5rem;
      font-size: .83rem;
      color: var(--text2)
    }

    .terms-row input {
      accent-color: var(--accent);
      margin-top: 3px
    }

    .progress-steps {
      display: flex;
      justify-content: center;
      gap: .5rem;
      margin-bottom: 2rem
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border2);
      transition: all .3s
    }

    .step-dot.active {
      background: var(--accent);
      transform: scale(1.3)
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: .85rem;
      color: var(--muted)
    }

    .auth-footer a {
      color: var(--accent);
      font-weight: 600
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Bistro<span>Royale</span></a>
      <div class="nav-right">
        <button class="theme-toggle"></button>
        <a href="login.html" class="btn btn-outline btn-sm">Login</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:1.5rem">
        <div class="nav-logo" style="font-size:1.8rem;display:inline-block;margin-bottom:.5rem">
          Bistro<span style="color:var(--accent)">Royale</span>
        </div>
      </div>

      <div class="progress-steps">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
      </div>

      <h2 class="auth-title">Create Account</h2>
      <p class="auth-sub">Join thousands of food lovers — sign up free</p>

      <form id="signup-form" novalidate>
        <!-- Name -->
        <div class="fgroup">
          <label for="s-name"><i class="fa-solid fa-user"></i> Full Name</label>
          <input type="text" id="s-name" placeholder="John Doe" autocomplete="name">
          <span class="ferr" id="s-name-e"></span>
        </div>

        <!-- Phone -->
        <div class="fgroup">
          <label for="s-phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
          <input type="tel" id="s-phone" placeholder="+1 555 000 0000" autocomplete="tel">
          <span class="ferr" id="s-phone-e"></span>
          <span class="fhint">We'll send your order updates here</span>
        </div>

        <!-- Email -->
        <div class="fgroup">
          <label for="s-email"><i class="fa-regular fa-envelope"></i> Email Address</label>
          <input type="email" id="s-email" placeholder="your@email.com" autocomplete="email">
          <span class="ferr" id="s-email-e"></span>
        </div>

        <!-- Password -->
        <div class="fgroup">
          <label for="s-pass"><i class="fa-solid fa-lock"></i> Password</label>
          <div class="pw-wrap">
            <input type="password" id="s-pass" placeholder="Minimum 6 characters">
            <button type="button" class="pw-eye" id="pw-toggle" aria-label="Toggle password">
              <i class="fa-regular fa-eye" id="pw-icon"></i>
            </button>
          </div>
          <div class="strength-bar">
            <div class="strength-fill" id="strength-fill"></div>
          </div>
          <div class="strength-text" id="strength-text" style="color:var(--muted)">Enter a password</div>
          <span class="ferr" id="s-pass-e"></span>
        </div>

        <!-- Favourite Food -->
        <div class="fgroup">
          <label><i class="fa-solid fa-heart"></i> Favourite Food Type (pick up to 3)</label>
          <div class="food-prefs" id="food-prefs">
            <div class="pref-chip" data-val="grills">🔥 Grills</div>
            <div class="pref-chip" data-val="seafood">🐟 Seafood</div>
            <div class="pref-chip" data-val="pasta">🍝 Pasta</div>
            <div class="pref-chip" data-val="desserts">🍰 Desserts</div>
            <div class="pref-chip" data-val="drinks">🥤 Drinks</div>
            <div class="pref-chip" data-val="vegan">🌿 Vegan</div>
            <div class="pref-chip" data-val="mains">🍗 Mains</div>
            <div class="pref-chip" data-val="starters">🥗 Starters</div>
            <div class="pref-chip" data-val="spicy">🌶 Spicy</div>
          </div>
          <span class="ferr" id="s-prefs-e"></span>
        </div>

        <!-- Terms -->
        <div class="terms-row">
          <input type="checkbox" id="s-terms">
          <label for="s-terms">
            I agree to the <a href="#" style="color:var(--accent)" onclick="return false">Terms of Service</a>
            and <a href="#" style="color:var(--accent)" onclick="return false">Privacy Policy</a>
          </label>
        </div>
        <span class="ferr" id="s-terms-e"></span>

        <button type="submit" class="btn btn-primary btn-block" id="signup-btn">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div>
    </div>
  </div>

  <script src="js/global.js"></script>
  <script>
    // Password strength
    const strengthColors = ['#e74c3c', '#e67e22', '#f1c40f', '#27ae60'];
    const strengthLabels = ['Weak', 'Fair', 'Good', 'Strong'];

    document.getElementById('s-pass').addEventListener('input', e => {
      const val = e.target.value;
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const fill = document.getElementById('strength-fill');
      const txt = document.getElementById('strength-text');
      if (!val) { fill.style.width = '0'; txt.textContent = 'Enter a password'; txt.style.color = 'var(--muted)'; return; }
      fill.style.width = ((score / 4) * 100) + '%';
      fill.style.background = strengthColors[score - 1] || '#e74c3c';
      txt.textContent = strengthLabels[score - 1] || 'Weak';
      txt.style.color = strengthColors[score - 1] || '#e74c3c';

      // Animate steps
      ['dot1', 'dot2', 'dot3'].forEach((id, i) => {
        document.getElementById(id).classList.toggle('active', score > i);
      });
    });

    // Password toggle
    document.getElementById('pw-toggle').addEventListener('click', () => {
      const inp = document.getElementById('s-pass');
      const icon = document.getElementById('pw-icon');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      icon.className = inp.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    });

    // Food pref chips
    let selectedPrefs = [];
    document.querySelectorAll('.pref-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const val = chip.dataset.val;
        if (chip.classList.contains('selected')) {
          chip.classList.remove('selected');
          selectedPrefs = selectedPrefs.filter(p => p !== val);
        } else {
          if (selectedPrefs.length >= 3) { toast('Max 3 preferences allowed!', 'bad'); return; }
          chip.classList.add('selected');
          selectedPrefs.push(val);
        }
      });
    });

    // JS Validation rules
    const fields = {
      's-name': [V.required, V.name],
      's-phone': [V.required, V.phone],
      's-email': [V.required, V.email],
      's-pass': [V.required, V.minLen(6)],
    };

    const form = document.getElementById('signup-form');
    setupLiveValidation(fields, form);

    form.addEventListener('submit', e => {
      e.preventDefault();
      let ok = true;

      // Validate all fields
      Object.keys(fields).forEach(id => { if (!validateField(id, fields[id], form)) ok = false; });

      // Validate food prefs
      if (selectedPrefs.length === 0) {
        const errEl = document.getElementById('s-prefs-e');
        errEl.textContent = 'Please select at least 1 food preference.';
        errEl.classList.add('show');
        ok = false;
      } else {
        document.getElementById('s-prefs-e').classList.remove('show');
      }

      // Validate terms (JS, not HTML5)
      const termsEl = document.getElementById('s-terms');
      if (!termsEl.checked) {
        const errEl = document.getElementById('s-terms-e');
        errEl.textContent = 'You must agree to the Terms of Service.';
        errEl.classList.add('show');
        ok = false;
      } else {
        document.getElementById('s-terms-e').classList.remove('show');
      }

      if (!ok) { toast('Please complete all required fields.', 'bad'); return; }

      // Save user to localStorage
      const newUser = {
        name: document.getElementById('s-name').value.trim(),
        phone: document.getElementById('s-phone').value.trim(),
        email: document.getElementById('s-email').value.trim(),
        prefs: selectedPrefs,
        loggedIn: true,
        createdAt: new Date().toISOString()
      };
      Auth.save(newUser); Auth.updateNav();

      const btn = document.getElementById('signup-btn');
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Account Created!';
      btn.style.background = '#27ae60';
      btn.disabled = true;

      toast('🎉 Welcome to Bistro Royale! Account created!', 'ok');
      setTimeout(() => window.location.href = 'profile.html', 1500);
    });
  </script>
</body>

</html>
